[project]
name = "git-pr-dev-tools"
version = "0.0.0"
requires-python = "==3.15.0"
dependencies = [
  "semver>=3.1.0",
  "tomlkit>=0.15.2",
]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["scripts"]
pythonVersion = "3.15"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = [".codegraph", ".venv", "target", "coverage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
include = ["*/scripts/version.py"]
data_file = "coverage/.versioning"
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true

[dependency-groups]
dev = [
  "coverage>=7.16.2",
]
