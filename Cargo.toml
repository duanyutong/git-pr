
[package]
name = "git-pr"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
description = "Submit Git and Jujutsu commits as stacked GitHub pull requests"
repository = "https://github.com/duanyutong/git-pr"
license.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["branchless", "cli", "git", "stack"]
publish = false
[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Explicit crate visibility prevents accidental public API expansion and satisfies unreachable_pub.
redundant_pub_crate = "allow"
nursery = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4.3"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustix = { version = "1.1.5", features = ["process", "termios"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4.1.0"

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
wait-timeout = "0.2.1"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
