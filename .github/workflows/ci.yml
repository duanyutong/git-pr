name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TEST_THREADS: '6'
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/prek
            target
          key: rust-acceptance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/dev-tools.env', 'pyproject.toml', 'uv.lock', 'prek.toml') }}-release
          restore-keys: |
            rust-acceptance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Host prerequisites
        id: prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev libssl-dev dbus-x11 gnome-keyring
          fi
          . scripts/dev-tools.env
          echo "uv=$UV_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.prerequisites.outputs.uv }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            prek.toml
      - name: Provision command runners
        shell: bash
        run: |
          . scripts/dev-tools.env
          uv run --no-project --with "rust-just==$JUST_VERSION" --with "prek==$PREK_VERSION" \
            sh -c '
              dirname "$(command -v just)" >> "$GITHUB_PATH"
              dirname "$(command -v prek)" >> "$GITHUB_PATH"
            '
      - run: sh setup.sh
      - run: just verify-versions
      - run: just check
      - name: Native credential storage
        if: runner.os == 'Linux'
        run: just credentials
      - name: Production executable
        run: |
          target/release/git-pr --version
          target/release/git-pr --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          path: target/validation/timings.jsonl

  boundaries:
    name: ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        gate: [backends, coverage, coverage-branches, assurance, mutants]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/prek
            target
          key: rust-boundary-${{ matrix.gate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/dev-tools.env', 'pyproject.toml', 'uv.lock', 'prek.toml') }}-release
          restore-keys: |
            rust-boundary-${{ matrix.gate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Host prerequisites
        id: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev libssl-dev dbus-x11 gnome-keyring
          . scripts/dev-tools.env
          echo "uv=$UV_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.prerequisites.outputs.uv }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            prek.toml
      - name: Provision command runners
        shell: bash
        run: |
          . scripts/dev-tools.env
          uv run --no-project --with "rust-just==$JUST_VERSION" --with "prek==$PREK_VERSION" \
            sh -c '
              dirname "$(command -v just)" >> "$GITHUB_PATH"
              dirname "$(command -v prek)" >> "$GITHUB_PATH"
            '
      - run: sh setup.sh
      - name: Install pinned branch instrumentation
        if: matrix.gate == 'coverage-branches'
        run: rustup toolchain install nightly-2026-10-14 --profile minimal --component llvm-tools-preview
      - name: Execute boundary gate
        env:
          BOUNDARY_GATE: ${{ matrix.gate }}
          GIT_PR_MUTATION_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ "$BOUNDARY_GATE" = mutants ]; then
            just mutants "$GIT_PR_MUTATION_BASE"
          else
            just "$BOUNDARY_GATE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.gate }}-evidence
          include-hidden-files: true
          path: |
            coverage/
            target/validation/*.json
            target/validation/*.jsonl
            target/validation/*.log
            target/validation/history/
            target/validation/assurance/
            target/validation/fuzz/
            proptest-regressions/
