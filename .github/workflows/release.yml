name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Tag validated versions
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Development tool versions
        id: tools
        run: |
          . scripts/dev-tools.env
          echo "uv=$UV_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          cache-python: true
      - name: Provision versioning environment
        run: uv sync --locked --no-dev
      - name: Configure tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify and publish annotated tags
        env:
          VALIDATED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$VALIDATED_HEAD" refs/remotes/origin/main; then
            printf 'Validated revision %s is no longer in origin/main; refusing to publish tags.\n' "$VALIDATED_HEAD" >&2
            exit 1
          fi
          uv run --locked --no-dev scripts/version.py tag-range 0000000000000000000000000000000000000000 "$VALIDATED_HEAD"
