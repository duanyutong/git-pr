name: Extended assurance

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TEST_THREADS: '6'
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: '4096'
  PROPTEST_RNG_SEED: ${{ github.run_id }}
  GIT_PR_ASSURANCE_CASES: '64'

jobs:
  campaigns:
    name: Extended ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        gate: [assurance, mutants, fuzz, coverage-branches]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/prek
            target
            fuzz/target
          key: assurance-${{ matrix.gate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'scripts/dev-tools.env', 'pyproject.toml', 'uv.lock', 'prek.toml') }}
          restore-keys: |
            assurance-${{ matrix.gate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Host prerequisites
        id: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev libssl-dev dbus-x11 gnome-keyring
          . scripts/dev-tools.env
          echo "uv=$UV_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.prerequisites.outputs.uv }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            prek.toml
      - name: Provision command runners
        shell: bash
        run: |
          . scripts/dev-tools.env
          uv run --no-project --with "rust-just==$JUST_VERSION" --with "prek==$PREK_VERSION" \
            sh -c '
              dirname "$(command -v just)" >> "$GITHUB_PATH"
              dirname "$(command -v prek)" >> "$GITHUB_PATH"
            '
      - run: sh setup.sh
      - name: Install pinned fuzzing compiler
        if: matrix.gate == 'fuzz'
        run: rustup toolchain install nightly-2026-10-14 --profile minimal
      - name: Install pinned branch instrumentation
        if: matrix.gate == 'coverage-branches'
        run: rustup toolchain install nightly-2026-10-14 --profile minimal --component llvm-tools-preview
      - name: Execute extended campaign
        env:
          ASSURANCE_GATE: ${{ matrix.gate }}
        run: |
          if [ "$ASSURANCE_GATE" = fuzz ]; then
            fuzz_seed="$((GITHUB_RUN_ID % 4294967296))"
            just fuzz 300 "$fuzz_seed"
          else
            just "$ASSURANCE_GATE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extended-${{ matrix.gate }}-evidence
          include-hidden-files: true
          path: |
            target/validation/assurance/
            target/validation/fuzz/
            target/validation/history/
            proptest-regressions/
